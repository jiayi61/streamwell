name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (protocol, scoring, checks, statistics, early warning, FHIR)
        run: node --test tests/*.test.mjs
      - name: FHIR examples regenerate and validate
        run: node scripts/build-fhir.mjs
